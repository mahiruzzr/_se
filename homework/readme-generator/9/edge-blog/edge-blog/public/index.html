<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>邊緣札記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
:root{--ink:#172433;--sub:#566574;--paper:#f3f5f7;--card:#fff;--rule:#cdd5dc;--accent:#2f4bd8;--danger:#b3261e;
--serif:"Noto Serif TC","Songti TC","PMingLiU",serif;--sans:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
@media(prefers-color-scheme:dark){:root{--ink:#e6ebf0;--sub:#9aa8b5;--paper:#10171e;--card:#17212b;--rule:#2b3945;--accent:#9fb0ff;--danger:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.9 var(--serif)}
.wrap{max-width:42rem;margin:0 auto;padding:0 1.25rem}
header{border-bottom:1px solid var(--rule);font-family:var(--sans)}
header .wrap{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding-top:1.6rem;padding-bottom:1rem}
.brand{font:700 1.6rem/1.2 var(--serif);letter-spacing:.12em;color:inherit;text-decoration:none}
.tag{margin:.15rem 0 0;font-size:.85rem;color:var(--sub)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-top:2rem;padding-bottom:4rem}
h1{font:700 2rem/1.4 var(--serif);margin:.5rem 0 .25rem}
h2{font:700 1.35rem/1.5 var(--serif);margin:0}
h2 a{color:inherit;text-decoration:none}
h2 a:hover{color:var(--accent);text-decoration:underline}
.item{padding:1.5rem 0;border-bottom:1px solid var(--rule)}
.excerpt{margin:.4rem 0;color:var(--ink)}
.meta,.dim{font:.85rem/1.6 var(--sans);color:var(--sub);margin:.25rem 0}
.post-body{white-space:pre-wrap;margin:1.5rem 0 2.5rem;font-size:1.06rem;line-height:2}
.comments{border-top:1px solid var(--rule);padding-top:1.5rem}
.comment{border-left:3px solid var(--rule);padding:.1rem 0 .1rem 1rem;margin:1.1rem 0}
.comment p{margin:.2rem 0;white-space:pre-wrap;line-height:1.75}
.who{font:700 .95rem var(--sans)}
.box{display:grid;gap:.6rem;margin:1.2rem 0;padding:1rem;background:var(--card);border:1px solid var(--rule);border-radius:6px;font-family:var(--sans)}
input,textarea{font:inherit;color:inherit;background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:.55rem .7rem;width:100%}
textarea{resize:vertical;line-height:1.7}
button{font:600 .95rem var(--sans);cursor:pointer;border-radius:4px;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:.5rem 1rem;justify-self:start}
@media(prefers-color-scheme:dark){button{color:#10171e}}
button.ghost{background:none;color:var(--accent)}
button.link{border:0;background:none;color:var(--sub);padding:0;text-decoration:underline}
button.danger{color:var(--danger)}
#note{font:.9rem var(--sans);min-height:1.4rem;margin:0 0 .5rem;color:var(--accent)}
#note.err{color:var(--danger)}
.err{color:var(--danger);font-family:var(--sans)}
dialog{border:1px solid var(--rule);border-radius:6px;background:var(--card);color:var(--ink);padding:1.2rem;max-width:22rem;width:90%}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{display:grid;gap:.7rem;font-family:var(--sans)}
dialog menu{display:flex;gap:.6rem;margin:0;padding:0}
footer{border-top:1px solid var(--rule);padding:1.5rem 0;font:.85rem var(--sans);color:var(--sub);text-align:center}
</style>
</head>
<body>
<header><div class="wrap">
  <div><a class="brand" href="#/">邊緣札記</a><p class="tag">寫在 Cloudflare 邊緣節點上的部落格</p></div>
  <button id="login" class="ghost">管理登入</button>
</div></header>
<main class="wrap"><p id="note" role="status"></p><div id="app"></div></main>
<footer>Workers + D1 全球部署</footer>

<dialog id="dlg">
  <form id="loginForm">
    <label for="tok">輸入管理金鑰（ADMIN_TOKEN）</label>
    <input id="tok" type="password" autocomplete="current-password" required>
    <menu><button>登入</button><button type="button" class="ghost" id="cancel">取消</button></menu>
  </form>
</dialog>

<script>
const app = document.getElementById("app");
const note = document.getElementById("note");
const loginBtn = document.getElementById("login");
const dlg = document.getElementById("dlg");
let token = localStorage.getItem("token") || "";
let admin = false;

// 一律用 textContent 建立節點，不拼接 HTML，避免 XSS
function h(tag, props = {}, ...kids) {
  const el = Object.assign(document.createElement(tag), props);
  el.append(...kids.flat().filter((k) => k != null && k !== false));
  return el;
}
const say = (msg, isErr) => { note.textContent = msg; note.className = isErr ? "err" : ""; };
const fmt = (s) => new Date(s.replace(" ", "T") + "Z").toLocaleDateString("zh-TW");

async function api(path, opts = {}) {
  const res = await fetch("/api" + path, {
    method: opts.method || "GET",
    headers: { "content-type": "application/json", ...(token && { "x-admin-token": token }) },
    body: opts.body && JSON.stringify(opts.body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "請求失敗，請稍後再試");
  return data;
}

async function checkAdmin() {
  admin = token ? (await api("/me")).admin : false;
  loginBtn.textContent = admin ? "登出" : "管理登入";
}

function editor() {
  const title = h("input", { placeholder: "標題", maxLength: 100, required: true });
  const body = h("textarea", { placeholder: "內容（純文字，換行會保留）", rows: 6, maxLength: 20000, required: true });
  return h("form", {
    className: "box",
    onsubmit: async (e) => {
      e.preventDefault();
      try {
        await api("/posts", { method: "POST", body: { title: title.value, body: body.value } });
        await render(false);
        say("已發布");
      } catch (err) { say(err.message, true); }
    },
  }, h("h2", {}, "寫新文章"), title, body, h("button", {}, "發布文章"));
}

async function listView() {
  document.title = "邊緣札記";
  const posts = await api("/posts");
  const out = [];
  if (admin) out.push(editor());
  if (!posts.length) out.push(h("p", { className: "dim" }, admin ? "還沒有文章，用上面的表單發布第一篇。" : "還沒有文章，晚點再來看看。"));
  for (const p of posts) {
    out.push(h("article", { className: "item" },
      h("h2", {}, h("a", { href: `#/post/${p.id}` }, p.title)),
      h("p", { className: "excerpt" }, p.excerpt + (p.excerpt.length >= 120 ? "…" : "")),
      h("p", { className: "meta" }, `${fmt(p.created_at)} 發布，${p.comments} 則留言`)));
  }
  return out;
}

async function postView(id) {
  const p = await api(`/posts/${id}`);
  document.title = `${p.title}－邊緣札記`;
  const del = (label, path, after) => h("button", {
    className: "link danger",
    onclick: async () => {
      if (!confirm(`確定要${label}嗎？`)) return;
      try { await api(path, { method: "DELETE" }); after(); } catch (e) { say(e.message, true); }
    },
  }, label);

  const author = h("input", { placeholder: "名稱（可留空）", maxLength: 30 });
  const text = h("textarea", { placeholder: "寫下你的想法", rows: 3, maxLength: 500, required: true });
  const form = h("form", {
    className: "box",
    onsubmit: async (e) => {
      e.preventDefault();
      try {
        await api(`/posts/${id}/comments`, { method: "POST", body: { author: author.value, body: text.value } });
        await render(false);
      } catch (err) { say(err.message, true); }
    },
  }, author, text, h("button", {}, "送出留言"));

  return [
    h("p", { className: "meta" }, h("a", { href: "#/" }, "回到文章列表")),
    h("article", {},
      h("h1", {}, p.title),
      h("p", { className: "meta" }, `${fmt(p.created_at)} 發布`, " ", admin && del("刪除文章", `/posts/${id}`, () => (location.hash = "#/"))),
      h("div", { className: "post-body" }, p.body)),
    h("section", { className: "comments" },
      h("h2", {}, `留言（${p.comments.length}）`),
      p.comments.map((c) => h("div", { className: "comment" },
        h("p", { className: "who" }, c.author),
        h("p", {}, c.body),
        h("p", { className: "meta" }, fmt(c.created_at), " ", admin && del("刪除留言", `/comments/${c.id}`, () => render(false))))),
      form),
  ];
}

async function render(top = true) {
  say("");
  const m = location.hash.match(/^#\/post\/(\d+)$/);
  try {
    app.replaceChildren(...(m ? await postView(+m[1]) : await listView()));
  } catch (e) {
    app.replaceChildren(h("p", { className: "err" }, e.message));
  }
  if (top) window.scrollTo(0, 0);
}

loginBtn.onclick = async () => {
  if (admin) {
    token = ""; localStorage.removeItem("token");
    await checkAdmin(); render(false);
  } else dlg.showModal();
};
document.getElementById("cancel").onclick = () => dlg.close();
document.getElementById("loginForm").onsubmit = async (e) => {
  e.preventDefault();
  token = document.getElementById("tok").value.trim();
  try { await checkAdmin(); } catch { admin = false; }
  dlg.close();
  if (admin) { localStorage.setItem("token", token); await render(false); say("已登入管理模式"); }
  else { token = ""; say("金鑰不正確", true); }
};

window.addEventListener("hashchange", () => render());
checkAdmin().catch(() => {}).finally(() => render());
</script>
</body>
</html>
